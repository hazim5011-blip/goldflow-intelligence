name: Publish GF-AAT R5.8 Stable

on:
  push:
    paths:
      - '.github/workflows/gfaat-r58-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build R5.8 from verified R5.7 stable plus audited patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gfaat-r58 /tmp/GF_AAT_STABLE.zip /tmp/r58.patch
          mkdir -p /tmp/gfaat-r58
          curl -L --fail             "https://raw.githubusercontent.com/hazim5011-blip/goldflow-intelligence/ac0ff2359afebfa5e398ae93005dd225cbdb86dd/gf-aat-update/GF_AAT_STABLE.zip"             -o /tmp/r57.zip
          unzip -q /tmp/r57.zip -d /tmp/gfaat-r58
          test -d /tmp/gfaat-r58/GF_AAT_R5_7_STABLE
          cat gf-aat-update/staging/r58.b64.* | base64 -d | gzip -d > /tmp/r58.patch
          cd /tmp/gfaat-r58/GF_AAT_R5_7_STABLE
          patch -p1 < /tmp/r58.patch
          cd /tmp/gfaat-r58
          mv GF_AAT_R5_7_STABLE GF_AAT_R5_8_STABLE
          zip -qr /tmp/GF_AAT_STABLE.zip GF_AAT_R5_8_STABLE             -x 'GF_AAT_R5_8_STABLE/.venv/*'                'GF_AAT_R5_8_STABLE/data/*'                'GF_AAT_R5_8_STABLE/logs/*'                'GF_AAT_R5_8_STABLE/backups/*'                'GF_AAT_R5_8_STABLE/_updates/*'                'GF_AAT_R5_8_STABLE/.pytest_cache/*'                'GF_AAT_R5_8_STABLE/**/__pycache__/*'                'GF_AAT_R5_8_STABLE/.env'
          cp /tmp/GF_AAT_STABLE.zip "$GITHUB_WORKSPACE/gf-aat-update/GF_AAT_STABLE.zip"
          cd "$GITHUB_WORKSPACE"
          HASH="$(sha256sum gf-aat-update/GF_AAT_STABLE.zip | awk '{print $1}')"
          cat > gf-aat-update/stable.json <<EOF
          {
            "channel": "stable",
            "version": "1.6.3-r5.8",
            "build_id": "gf-aat-1.6.3-r5.8-professional-trade-coach",
            "package_url": "https://raw.githubusercontent.com/hazim5011-blip/goldflow-intelligence/main/gf-aat-update/GF_AAT_STABLE.zip",
            "sha256": "$HASH",
            "restart_cmd": "RESTART_GF_AAT_R5_8.bat",
            "minimum_updater": 2
          }
          EOF

      - name: Publish stable channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gf-aat-update/GF_AAT_STABLE.zip gf-aat-update/stable.json
          git commit -m "Publish GF-AAT R5.8 professional trade coach stable update"
          git push

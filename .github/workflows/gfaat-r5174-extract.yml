name: GF-AAT R5.17.4 Extract Selected Source

on:
  push:
    paths:
      - 'gf-aat-update/staging/TRIGGER_R5174_EXTRACT.txt'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract selected R5.17.3 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gfaat-r5174-src gf-aat-update/inspect/r5173
          mkdir -p /tmp/gfaat-r5174-src gf-aat-update/inspect/r5173/aat
          unzip -q gf-aat-update/GF_AAT_STABLE.zip -d /tmp/gfaat-r5174-src
          ROOT=/tmp/gfaat-r5174-src/GF_AAT_R5_17_3_STABLE
          for f in             aat/raw_news.py             aat/external_context.py             aat/causal_context.py             aat/analyst_brain.py             aat/cognitive_brain.py             aat/decision_engine.py             aat/service.py             aat/web.py             aat/dashboard.html             aat/settings.py             aat/storage.py             aat/models.py             aat/pro_signal.py             aat/pro_reasoning.py             aat/__main__.py             requirements.txt             .env.example             CURRENT_BUILD.json; do
              mkdir -p "gf-aat-update/inspect/r5173/$(dirname "$f")"
              cp "$ROOT/$f" "gf-aat-update/inspect/r5173/$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gf-aat-update/inspect/r5173
          git commit -m "Extract selected GF-AAT R5.17.3 source for R5.17.4 audit"
          git push

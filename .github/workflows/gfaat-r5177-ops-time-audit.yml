name: GF-AAT R5.17.7 Ops Time Audit

on:
  push:
    paths:
      - 'gf-aat-update/staging/TRIGGER_R5177_OPS_TIME_AUDIT.txt'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect OpenAI Ops schedule
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gfaat-r5177-audit && mkdir -p /tmp/gfaat-r5177-audit
          unzip -q gf-aat-update/GF_AAT_STABLE.zip -d /tmp/gfaat-r5177-audit
          ROOT="$(find /tmp/gfaat-r5177-audit -maxdepth 1 -mindepth 1 -type d | head -n1)"
          echo '=== OPENAI OPS ==='; sed -n '1,520p' "$ROOT/aat/openai_ops.py"
          echo '=== SCHEDULE MATCHES ==='; grep -RIn -E '18:00|06:00|6:00|PM MALAYSIA|AM MALAYSIA|daily|DAILY|MYT|Malaysia|Asia/Kuala_Lumpur' "$ROOT/aat" | head -n 500 || true

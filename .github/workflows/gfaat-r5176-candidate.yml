name: GF-AAT R5.17.6 OpenAI Live Trader Candidate

on:
  push:
    paths:
      - 'gf-aat-update/staging/TRIGGER_R5176_CANDIDATE.txt'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify R5.17.5 stable baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          m=json.loads(pathlib.Path('gf-aat-update/stable.json').read_text(encoding='utf-8'))
          assert m['version']=='1.6.3-r5.17.5',m
          assert m['build_id']=='gf-aat-1.6.3-r5.17.5-day-signal-rebalance',m
          p=pathlib.Path('gf-aat-update/GF_AAT_STABLE.zip')
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual==m['sha256'],(actual,m['sha256'])
          print('R5.17.5 baseline PASS',actual)
          PY

      - name: Build R5.17.6 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gfaat-r5176 /tmp/r5176_transform.py.gz /tmp/r5176_transform.py
          mkdir -p /tmp/gfaat-r5176
          unzip -q gf-aat-update/GF_AAT_STABLE.zip -d /tmp/gfaat-r5176
          ROOT=/tmp/gfaat-r5176/GF_AAT_R5_17_5_STABLE
          test -d "$ROOT"
          echo '41623f924d773768cfe93d1b57e251b18166178d5101e9edd8fd59827e0702c3  gf-aat-update/staging/r5176_transform.b64.00' | sha256sum -c -
          echo '4f98bfcd3c7a72717518f01c8349f497db00671d36da4c2fa3d5b383272cc72c  gf-aat-update/staging/r5176_transform.b64.01' | sha256sum -c -
          echo 'cbb6a29d0bfd22278cb1a1382b6e67f724cc79ff84ab6a865ccf726e9a2b0dfd  gf-aat-update/staging/r5176x02.0' | sha256sum -c -
          echo 'c51ed49df1ac172b3663954efa840e7eee9b013793d78e63e072d797e637cef4  gf-aat-update/staging/r5176x02.1' | sha256sum -c -
          echo 'cd5b9f839ce12ed2801627c336e698e4575c799d906ab610989a797a261d6cc8  gf-aat-update/staging/r5176x02.2' | sha256sum -c -
          echo '4a9fdc68f7502234adb4cc382fe3f0d1a97212702ceffab12bd2d14e3a092771  gf-aat-update/staging/r5176x02.3' | sha256sum -c -
          echo '45fd9209514da1e0ab3dec323491f964ff1f07c052b9326e4ddf6ca2b91a1c9d  gf-aat-update/staging/r5176x03.0' | sha256sum -c -
          echo '8b0b84e547f8285e01df7f972323f9e958f6909e5b35a31cfcbc4fe15eef1ba6  gf-aat-update/staging/r5176x03.1' | sha256sum -c -
          echo 'e9874935366619dcafbfb2b9565f721960fd7eb2949c87f98f4e6b3f1fda2333  gf-aat-update/staging/r5176x03.2' | sha256sum -c -
          cat gf-aat-update/staging/r5176_transform.b64.00 gf-aat-update/staging/r5176_transform.b64.01 gf-aat-update/staging/r5176x02.0 gf-aat-update/staging/r5176x02.1 gf-aat-update/staging/r5176x02.2 gf-aat-update/staging/r5176x02.3 gf-aat-update/staging/r5176x03.0 gf-aat-update/staging/r5176x03.1 gf-aat-update/staging/r5176x03.2 > /tmp/r5176_transform.b64
          base64 -d /tmp/r5176_transform.b64 > /tmp/r5176_transform.py.gz
          echo '114618d8d8947be586a00989b3055b66400c1f825f5379c3328193e3ce1adc3f  /tmp/r5176_transform.py.gz' | sha256sum -c -
          gzip -dc /tmp/r5176_transform.py.gz > /tmp/r5176_transform.py
          echo '611522416048c992cd5be1e6c1354cab5027fe4255fd005a07c8f000a15db9d7  /tmp/r5176_transform.py' | sha256sum -c -
          python3 -m py_compile /tmp/r5176_transform.py
          python3 /tmp/r5176_transform.py "$ROOT"
          python3 - "$ROOT" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])/'aat/service.py'
          s=p.read_text(encoding='utf-8')
          s=s.replace("plan['evidence']['openai_live_trader']=study.get('openai_live_trader') or {}\\n        plan['evidence']['openai_live_trader_version']=OPENAI_LIVE_VERSION\\n        plan['evidence']['qualification_generation']='R5.17.6_OPENAI_LIVE_TRADER'",
                      "plan['evidence']['openai_live_trader']=study.get('openai_live_trader') or {}\n        plan['evidence']['openai_live_trader_version']=OPENAI_LIVE_VERSION\n        plan['evidence']['qualification_generation']='R5.17.6_OPENAI_LIVE_TRADER'")
          p.write_text(s,encoding='utf-8')
          PY
          cd "$ROOT"
          python3 -m py_compile aat/openai_client.py aat/openai_brain.py aat/service.py aat/web.py setup_openai_brain.py
          python3 - <<'PY'
          import json
          b=json.load(open('CURRENT_BUILD.json',encoding='utf-8'))
          assert b['version']=='1.6.3-r5.17.6',b
          assert b['runtime_revision']=='R5.17.6',b
          assert b['build_id']=='gf-aat-1.6.3-r5.17.6-openai-live-trader',b
          assert b['restart_cmd']=='RESTART_GF_AAT_R5_17_6.bat',b
          assert b['research_only'] is True and int(b['orders_sent'])==0,b
          print('R5.17.6 exact build PASS')
          PY

      - name: Install dependencies
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check -r /tmp/gfaat-r5176/GF_AAT_R5_17_5_STABLE/requirements.txt

      - name: Run full tests
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gfaat-r5176/GF_AAT_R5_17_5_STABLE
          python3 -m pytest -q | tee /tmp/gfaat-r5176-pytest.txt
          grep -Eq '225 passed' /tmp/gfaat-r5176-pytest.txt

      - name: Safety and secret audit
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gfaat-r5176/GF_AAT_R5_17_5_STABLE
          python3 - <<'PY'
          import ast,pathlib,json
          bad=[]
          for p in pathlib.Path('aat').rglob('*.py'):
              tree=ast.parse(p.read_text(encoding='utf-8',errors='ignore'),filename=str(p))
              for n in ast.walk(tree):
                  if isinstance(n,ast.Call):
                      f=n.func
                      if isinstance(f,ast.Name) and f.id=='order_send': bad.append((str(p),n.lineno))
                      if isinstance(f,ast.Attribute) and f.attr=='order_send': bad.append((str(p),n.lineno))
          assert not bad,bad
          from aat.openai_brain import LIVE_VERSION,live_profile_enabled
          from aat.openai_client import LIVE_SIGNAL_SCHEMA
          assert LIVE_VERSION=='GF-AAT-OPENAI-LIVE-TRADER-BRAIN-1.0.0'
          assert LIVE_SIGNAL_SCHEMA['properties']['market_call']['enum']==['BUY','SELL','WAIT']
          src=pathlib.Path('aat/dashboard.html').read_text(encoding='utf-8')
          assert 'OpenAI Live Trader Brain' in src and 'AI LIVE CALL' in src
          env=pathlib.Path('.env.example').read_text(encoding='utf-8')
          assert 'AAT_OPENAI_LIVE_PROFILES=DAY' in env
          for p in pathlib.Path('.').rglob('*'):
              if p.is_file() and p.name!='.env' and p.stat().st_size<2_000_000:
                  txt=p.read_text(encoding='utf-8',errors='ignore')
                  assert 'sk-proj-' not in txt and 'sk-live-' not in txt
          print('SAFETY PASS: no broker order call')
          print('SECRET PASS: no API key committed')
          print('LIVE TRADER CONTRACT PASS')
          PY

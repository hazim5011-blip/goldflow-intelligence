name: GoldFlow V8 CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  v8-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify six indicator engines are untouched
        shell: bash
        run: |
          git fetch origin main --depth=1
          changed="$(git diff --name-only origin/main...HEAD -- \
            api/_indicator105.js \
            api/_indicator103.js \
            api/_indicatorPVT102.js \
            api/_indicatorPattern132.js \
            api/_indicatorSND107.js \
            api/_indicatorOWL101.js)"
          if [ -n "$changed" ]; then
            echo "Protected indicator engine files changed:"
            echo "$changed"
            exit 1
          fi

      - name: Enforce Vercel Hobby function limit
        shell: bash
        run: |
          count="$(find api -maxdepth 1 -type f -name '*.js' ! -name '_*' | wc -l | tr -d ' ')"
          echo "Deployable API functions: $count"
          test "$count" -le 12

      - name: JavaScript syntax checks
        shell: bash
        run: |
          node --check app.js
          node --check v8.js
          node --check study-ui.js
          find api -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Python bridge syntax check
        run: python -m py_compile bridge/mt5_bridge.py bridge/macro_sources.py bridge/test_macro_sources.py

      - name: Offline authenticated Windows macro source unit tests
        run: python -m unittest discover -s bridge -p 'test_macro_sources.py' -v

      - name: V8 unit and policy tests
        run: npm test

      - name: Cloudflare build dependencies
        run: npm install --no-audit --no-fund

      - name: Cloudflare adapter tests and build (NO DEPLOYMENT)
        run: |
          npm run test:cloudflare
          npm run build:cloudflare
          node --check dist/_worker.js
          test -f dist/study-ui.js
          test -f dist/_routes.json
          test -f dist/locales/ms.json
          if grep -q 'FORWARD_STORAGE_NOT_CONFIGURED' dist/_worker.js; then echo 'Forward proof remains disabled as expected'; fi
          if grep -q 'BLOB_READ_WRITE_TOKEN.*put(' dist/_worker.js; then echo 'Unexpected Vercel storage in CF bundle'; exit 1; fi

<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061018">
<title>GoldFlow Intelligence</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#061018;color:#edf6fb;font-family:system-ui,-apple-system,Segoe UI,Arial}
body{display:grid;place-items:center}
.box{text-align:center;padding:28px}
.logo{width:64px;height:64px;border-radius:18px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(135deg,#ffdc7d,#b77b17);color:#201400;font-weight:950;font-size:20px}
h1{margin:0;font-size:26px}
p{margin:10px 0;color:#8096a6}
.badge{display:inline-block;margin-top:16px;padding:9px 13px;border:1px solid #255543;border-radius:999px;color:#9ce5c7;background:#0b211a}
.err{display:none;margin-top:18px;color:#ffacba}
button{margin-top:12px;border:1px solid #356079;background:#173449;color:white;padding:10px 16px;border-radius:10px;font-weight:700}
</style>
</head>
<body>
<main class="box">
  <div class="logo">GF</div>
  <h1>GoldFlow Intelligence</h1>
  <p id="msg">Checking latest release…</p>
  <div id="badge" class="badge">AUTO UPDATE ON</div>
  <div id="err" class="err">
    <div>Unable to open the latest release.</div>
    <button onclick="boot()">Try again</button>
  </div>
</main>
<script>
const MANIFEST="/release.json";

async function readRelease(){
  const r = await fetch(MANIFEST + "?t=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error("Manifest HTTP " + r.status);
  const x = await r.json();
  if(!x.version || !x.url) throw new Error("Invalid release manifest");
  return x;
}
async function boot(){
  document.getElementById("err").style.display="none";
  document.getElementById("msg").textContent="Checking latest release…";
  try{
    const rel = await readRelease();
    localStorage.setItem("goldflow_latest_release", JSON.stringify(rel));
    document.getElementById("badge").textContent="LATEST RELEASE: V" + rel.version;
    document.getElementById("msg").textContent="Opening latest version…";
    setTimeout(()=>location.replace(rel.url), 350);
  }catch(e){
    const cached = localStorage.getItem("goldflow_latest_release");
    if(cached){
      try{
        const rel = JSON.parse(cached);
        document.getElementById("badge").textContent="CACHED RELEASE: V" + rel.version;
        document.getElementById("msg").textContent="Opening saved release…";
        setTimeout(()=>location.replace(rel.url), 350);
        return;
      }catch(_){}
    }
    document.getElementById("msg").textContent="Update check failed.";
    document.getElementById("err").style.display="block";
  }
}
boot();
</script>
</body>
</html>
